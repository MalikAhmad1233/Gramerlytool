name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (FastAPI + LanguageTool + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: writemind
          POSTGRES_PASSWORD: writemind
          POSTGRES_DB: writemind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U writemind" --health-interval 5s --health-retries 20
    env:
      WRITEMIND_TEST_DATABASE_URL: postgresql+asyncpg://writemind:writemind@localhost:5432/writemind_test
      WRITEMIND_LANGUAGETOOL_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven, cache-dependency-path: infra/languagetool/pom.xml }
      - name: Fetch and start LanguageTool
        run: |
          ./scripts/fetch-languagetool.sh
          nohup ./scripts/run-languagetool.sh > lt.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:8081/v2/languages > /dev/null && break; sleep 2; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests && ruff format --check app tests
      - name: Test
        working-directory: backend
        run: pytest -q

  extension:
    name: Chrome extension (unit + e2e)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: writemind, POSTGRES_PASSWORD: writemind, POSTGRES_DB: writemind }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U writemind" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: extension/package-lock.json }
      - name: Install
        working-directory: extension
        run: npm ci
      - name: Typecheck and unit tests
        working-directory: extension
        run: npm run compile && npm test
      - name: Build and package
        working-directory: extension
        run: npm run build && npm run zip
      - uses: actions/upload-artifact@v4
        with: { name: writemind-chrome-extension, path: extension/.output/*.zip }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven, cache-dependency-path: infra/languagetool/pom.xml }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Start backend stack for e2e
        env:
          WRITEMIND_RATE_LIMIT_ENABLED: "false"
        run: |
          ./scripts/fetch-languagetool.sh
          nohup ./scripts/run-languagetool.sh > lt.log 2>&1 &
          cd backend && pip install -e . && alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:8000/health/ready > /dev/null && break; sleep 2; done
      - name: End-to-end tests (real Chromium + extension + API)
        working-directory: extension
        run: |
          # The runner image already has Chromium's system libraries; if the Ubuntu mirrors are unreachable,
          # install just the browser rather than failing the job.
          npx playwright install --with-deps chromium || npx playwright install chromium
          xvfb-run -a npx playwright test --trace off

  desktop:
    name: Windows app (.NET 10 WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Build
        working-directory: desktop
        run: dotnet build WriteMind.slnx -c Release
      - name: Test
        working-directory: desktop
        run: dotnet test --solution WriteMind.slnx -c Release --no-build
      - name: Publish
        working-directory: desktop
        run: dotnet publish src/WriteMind.Desktop/WriteMind.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with: { name: writemind-windows-x64, path: desktop/publish }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: extension/package-lock.json }
      - name: Build the Chrome extension (shipped inside the installer)
        working-directory: extension
        run: npm ci && npm run build
      - name: Build the installer (NSIS)
        shell: bash
        run: |
          if ! command -v makensis >/dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then choco install nsis -y --no-progress; fi
          desktop/installer/build-installer.sh desktop/publish/WriteMind.exe extension/.output/chrome-mv3 desktop/WriteMind-Setup-1.1.0.exe 1.1.0
      - uses: actions/upload-artifact@v4
        with: { name: writemind-setup, path: desktop/WriteMind-Setup-*.exe }
