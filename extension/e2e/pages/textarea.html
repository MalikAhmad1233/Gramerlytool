<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Textarea test</title>
<style>body { font: 16px/1.5 Arial, sans-serif; margin: 40px; } textarea, input { font: 16px/1.5 Arial, sans-serif; display: block; margin-bottom: 24px; padding: 8px; width: 640px; }</style>
</head>
<body>
  <label>Message <textarea id="ta" rows="6"></textarea></label>
  <label>Password <input id="pw" type="password"></label>
  <label>Card number <input id="card" type="text" name="cardNumber"></label>
  <label>Opted out <textarea id="optout" data-gramm="false" rows="3"></textarea></label>
  <label>Subject <input id="subject" type="text"></label>
</body>
</html>
